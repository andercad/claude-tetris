<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-label">Modo claro</span>
    <span class="switch"></span>
  </button>

  <select id="skin-select" class="skin-select" aria-label="Skin">
    <option value="retro">Retro</option>
    <option value="neon">Neon</option>
    <option value="pastel">Pastel</option>
    <option value="pixel">Pixel art</option>
  </select>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
            <li><kbd>K</kbd> skin</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Récords en game over -->
        <div id="go-records" class="records-box hidden">
          <p id="go-msg" class="records-msg"></p>
          <form id="go-form" class="name-form hidden" onsubmit="return false">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre del jugador" />
            <button id="save-btn" type="button">Guardar</button>
          </form>
          <div id="go-table"></div>
          <button type="button" class="clear-records-btn">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Menú de pausa -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>
        <button id="pause-resume" class="menu-btn" data-menu-item="resume">Reanudar</button>
        <button id="pause-restart" class="menu-btn" data-menu-item="restart">Reiniciar</button>
        <button id="pause-controls-btn" class="menu-btn" data-menu-item="controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          <li><kbd>T</kbd> tema</li>
        </ul>
        <div id="pause-level" class="menu-level" data-menu-item="level" tabindex="-1">
          <span>Nivel inicial</span>
          <button id="pause-level-down" tabindex="-1" aria-label="Bajar nivel inicial">&minus;</button>
          <span id="pause-level-value">1</span>
          <button id="pause-level-up" tabindex="-1" aria-label="Subir nivel inicial">+</button>
        </div>
      </div>
    </div>

    <!-- Pantalla de inicio con récords -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">RÉCORDS</p>
        <div id="start-records" class="records-box"></div>
        <button id="start-btn" type="button">Jugar</button>
        <button type="button" class="clear-records-btn">Borrar récords</button>
        <p class="start-hint">Pulsa <kbd>Enter</kbd> para jugar</p>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
